name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "README.md", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "docs/**", "README.md", ".github/workflows/site.yml"]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      # The pnpm version is the one site/package.json names in packageManager.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run audit:dist
      - run: pnpm run test:worker
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run e2e
