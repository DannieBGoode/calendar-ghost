name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      # From the release's gitleaks_8.30.1_checksums.txt.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      # Scans only the commits this event adds: a pull request's own commits, or the commits a push
      # to main brings. Any finding fails the job.
      - name: Scan new commits for secrets
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          range="${BASE}..${HEAD}"
          # A push that creates the branch, or that follows a force push, has no earlier commit to
          # compare with, so everything reachable from it is new.
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then range="$HEAD"; fi
          "$RUNNER_TEMP/gitleaks" git . --log-opts="$range" --redact --verbose --no-banner

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: lint-imports
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Fails on a known high or critical advisory in any installed package, build tools included,
      # because they run in CI and in the image build.
      - run: npm audit --audit-level=high
      - run: npm run api:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run doctor
      - run: npm run knip
      - run: npm run test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    # A build takes 4 to 8 minutes; a stalled emulated arm64 step fails here instead of after
    # GitHub's six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            CALENDAR_GHOST_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
