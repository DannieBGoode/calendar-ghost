<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfbfe" />
    <script>
      (() => {
        const storageKey = "calendar-sync-theme"
        let savedTheme = null
        try {
          savedTheme = localStorage.getItem(storageKey)
        } catch {
          // Storage can be unavailable in privacy-restricted browser contexts.
        }
        const prefersDark =
          typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches
        const theme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : prefersDark
              ? "dark"
              : "light"
        const root = document.documentElement
        root.dataset.theme = theme
        root.style.colorScheme = theme
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#0d0e19" : "#fbfbfe")
      })()
    </script>
    <meta
      name="description"
      content="Calendar Ghost: self-hosted, one-way Google Calendar sync. Your busy time, everywhere it needs to be."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Calendar Ghost</title>
    <script type="module" crossorigin src="/assets/index-Dot6S5BI.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BZCDFA5Z.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
