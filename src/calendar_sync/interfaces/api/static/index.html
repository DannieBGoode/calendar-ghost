<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfbfe" />
    <script>
      (() => {
        const storageKey = "calendar-sync-theme"
        const paletteKey = "calendar-sync-dark-palette"
        let savedTheme = null
        let savedPalette = null
        try {
          savedTheme = localStorage.getItem(storageKey)
          savedPalette = localStorage.getItem(paletteKey)
        } catch {
          // Storage can be unavailable in privacy-restricted browser contexts.
        }
        const prefersDark =
          typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches
        const theme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : prefersDark
              ? "dark"
              : "light"
        const palette = savedPalette === "midnight" ? "midnight" : "twilight"
        const root = document.documentElement
        root.dataset.theme = theme
        root.dataset.palette = palette
        root.style.colorScheme = theme
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute(
            "content",
            theme === "light" ? "#fbfbfe" : palette === "midnight" ? "#05101c" : "#0d0e19",
          )
      })()
    </script>
    <meta
      name="description"
      content="Calendar Ghost: self-hosted, one-way Google Calendar sync. Your busy time, everywhere it needs to be."
    />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon-B6Lbq2Jw.svg" />
    <title>Calendar Ghost</title>
    <script type="module" crossorigin src="/assets/index-BdXqa-FJ.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-3tg4rokM.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
