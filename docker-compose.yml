services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      CALENDAR_SYNC_DATABASE_PATH: /data/calendar-sync.db
      CALENDAR_SYNC_LOG_LEVEL: ${CALENDAR_SYNC_LOG_LEVEL:-INFO}
      CALENDAR_SYNC_SECURE_COOKIES: ${CALENDAR_SYNC_SECURE_COOKIES:-false}
      CALENDAR_SYNC_MASTER_KEY: ${CALENDAR_SYNC_MASTER_KEY:-}
      CALENDAR_SYNC_GOOGLE_CLIENT_ID: ${CALENDAR_SYNC_GOOGLE_CLIENT_ID:-}
      CALENDAR_SYNC_GOOGLE_CLIENT_SECRET: ${CALENDAR_SYNC_GOOGLE_CLIENT_SECRET:-}
      CALENDAR_SYNC_GOOGLE_REDIRECT_URI: ${CALENDAR_SYNC_GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/oauth/google/callback}
      CALENDAR_SYNC_INCIDENT_WEBHOOK_URL: ${CALENDAR_SYNC_INCIDENT_WEBHOOK_URL:-}
      CALENDAR_SYNC_SMTP_HOST: ${CALENDAR_SYNC_SMTP_HOST:-}
      CALENDAR_SYNC_SMTP_PORT: ${CALENDAR_SYNC_SMTP_PORT:-587}
      CALENDAR_SYNC_SMTP_USERNAME: ${CALENDAR_SYNC_SMTP_USERNAME:-}
      CALENDAR_SYNC_SMTP_PASSWORD: ${CALENDAR_SYNC_SMTP_PASSWORD:-}
      CALENDAR_SYNC_SMTP_SENDER: ${CALENDAR_SYNC_SMTP_SENDER:-}
      CALENDAR_SYNC_SMTP_RECIPIENT: ${CALENDAR_SYNC_SMTP_RECIPIENT:-}
      CALENDAR_SYNC_SMTP_STARTTLS: ${CALENDAR_SYNC_SMTP_STARTTLS:-true}
    volumes:
      - calendar-sync-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  calendar-sync-data:
